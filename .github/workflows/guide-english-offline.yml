name: Generate English guide translations (offline)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/content/**"
      - "src/lib/guide-i18n.ts"
      - "scripts/export-guides-for-translation.cjs"
      - "scripts/translate-guides-offline.py"
      - ".github/workflows/guide-english-offline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  translate:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'feat/pseo-english-')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    concurrency:
      group: guide-en-translation-${{ github.head_ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install site dependencies
        run: npm ci
      - name: Install offline translation engine
        run: python -m pip install argostranslate==1.11.0
      - name: Export exact published Polish content
        run: node scripts/export-guides-for-translation.cjs /tmp/bernecki-guide-source-pl.json
      - name: Translate every published article to English without an API
        env:
          ARGOS_DEVICE_TYPE: cpu
          ARGOS_CHUNK_TYPE: SPACY
          PYTHONUNBUFFERED: "1"
        run: python scripts/translate-guides-offline.py /tmp/bernecki-guide-source-pl.json src/content/pseo/guide-translations.en.json
      - name: Validate full translation corpus
        run: node scripts/check-guide-translations.cjs /tmp/bernecki-guide-source-pl.json src/content/pseo/guide-translations.en.json
      - name: Commit reviewed-by-machine output to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/pseo/guide-translations.en.json
          if ! git diff --cached --quiet; then
            git commit -m "content(i18n): add full offline English guide translations"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi
