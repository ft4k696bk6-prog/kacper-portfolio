name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: node --check scripts/pseo-autopilot.mjs
      - run: node scripts/pseo-autopilot.mjs --dry-run
      - run: npm run pseo:qa
      - run: npm run build
